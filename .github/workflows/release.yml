name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="$GITHUB_REF_NAME" -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            args: ""
          - runner: macos-14
            args: --target universal-apple-darwin
          - runner: windows-2025
            args: ""
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: macOS targets for the universal build
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.1 --locked

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Frontend packages
        run: pnpm -C frontend install --frozen-lockfile

      - name: THIRD_PARTY_LICENSES.txt is current
        run: |
          scripts/third-party-licenses.sh
          if ! git diff --exit-code THIRD_PARTY_LICENSES.txt; then
            echo "::error file=THIRD_PARTY_LICENSES.txt::stale: run 'just third-party-licenses' and commit the result"
            exit 1
          fi

      - name: Ubuntu library versions for the AppImage's licence file
        if: runner.os == 'Linux'
        run: scripts/third-party-licenses.sh ubuntu-versions

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft-release.outputs.id }}
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
