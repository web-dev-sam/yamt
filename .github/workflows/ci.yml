name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            app: --no-bundle
          - runner: macos-14
            app: --no-bundle
          - runner: windows-2025
            app: --bundles nsis
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup

      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: nextest,just

      - name: Rust tests without the runner's git config (RK19)
        run: just test

      - name: App build
        run: cargo tauri build ${{ matrix.app }}

      - name: Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: yamt-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup
        with:
          rust: "false"

      - name: Frontend unit tests
        run: pnpm -C frontend test
