[workspace]
resolver = "3"
members = [
  "crates/merge-core",
  "crates/gitio",
  "crates/session",
  "crates/cli",
  "crates/conflict-repo",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
yamt-merge-core = { path = "crates/merge-core" }
yamt-gitio = { path = "crates/gitio" }
yamt-session = { path = "crates/session" }
yamt-conflict-repo = { path = "crates/conflict-repo" }
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
imara-diff = "0.2.0"
proptest = "1.11.0"
tracing = "0.1.44"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# 2.12.1, not today's 2.12.3: same supply-chain cool-down pnpm applies to @tauri-apps/api; matches tauri-cli 2.12.1.
tauri = "2.12.1"
tauri-build = "2.7.1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[workspace.lints.rust]
# deny, not forbid: the app's NVIDIA start-up guard is the one allowed `unsafe` (plan §2 #43, arch-check);
# every library crate keeps `#![forbid(unsafe_code)]`.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
too_many_lines = "warn"
# skill://comment-policy forbids `# Errors` / `# Panics` doc sections.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
