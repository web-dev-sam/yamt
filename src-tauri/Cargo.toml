[package]
name = "yamt-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
default-run = "yamt"

[[bin]]
name = "yamt"
path = "src/main.rs"

# The generator behind `just bindings`. Off in `cargo tauri build`, so the bundles carry only `yamt`:
# tauri bundles every bin it is not told to skip, and the universal macOS build makes only the main one.
[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["bindings"]

[features]
bindings = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
yamt-session.workspace = true
yamt-settings.workspace = true
yamt-lsp-host.workspace = true
yamt-compare.workspace = true
yamt-range.workspace = true
yamt-review.workspace = true
yamt-agent.workspace = true
yamt-merge-requests.workspace = true
serde.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true

[dev-dependencies]
yamt-conflict-repo.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
