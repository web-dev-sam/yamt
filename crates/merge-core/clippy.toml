too-many-lines-threshold = 40
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-types = [
    { path = "std::process::Command", reason = "merge-core is pure: no subprocesses" },
    { path = "std::fs::File", reason = "merge-core is pure: no file I/O" },
    { path = "std::fs::OpenOptions", reason = "merge-core is pure: no file I/O" },
]

disallowed-methods = [
    { path = "std::process::Command::new", reason = "merge-core is pure: no subprocesses" },
    { path = "std::fs::read", reason = "merge-core is pure: no file I/O" },
    { path = "std::fs::read_to_string", reason = "merge-core is pure: no file I/O" },
    { path = "std::fs::read_dir", reason = "merge-core is pure: no file I/O" },
    { path = "std::fs::write", reason = "merge-core is pure: no file I/O" },
    { path = "std::fs::File::open", reason = "merge-core is pure: no file I/O" },
    { path = "std::fs::File::create", reason = "merge-core is pure: no file I/O" },
]
